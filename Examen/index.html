<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Redes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Por aca te dejo mis redes sociales</h1>
    <p class="subtitle">Sígueme en mis redes sociales</p>
    <ul class="list" role="list">

        <!-- Instagram -->
    <a class="item item-instagram" href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" role="listitem">
      <div class="icon-wrap">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram">
      </div>
      <div class="info">
        <div class="name">Instagram</div>
        <div class="handle">instagram.com</div>
      </div>
      <span class="arrow">→</span>
    </a>

    <!-- X (Twitter) -->
    <a class="item item-x" href="https://www.x.com" target="_blank" rel="noopener noreferrer" role="listitem">
      <div class="icon-wrap">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg" alt="X Twitter">
      </div>
      <div class="info">
        <div class="name">X (Twitter)</div>
        <div class="handle">x.com</div>
      </div>
      <span class="arrow">→</span>
    </a>

    <!-- YouTube -->
    <a class="item item-youtube" href="https://www.youtube.com" target="_blank" rel="noopener noreferrer" role="listitem">
      <div class="icon-wrap">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg" alt="YouTube">
      </div>
      <div class="info">
        <div class="name">YouTube</div>
        <div class="handle">youtube.com</div>
      </div>
      <span class="arrow">→</span>
    </a>

</body>
</html>
